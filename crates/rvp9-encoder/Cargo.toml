[package]
name = "rvp9-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "VP9 real-time video encoder. Mirrors libvpx tile-threaded architecture; targets WebRTC and livestream use cases."
readme = "README.md"
keywords = ["vp9", "video", "encoder", "codec", "webrtc"]
categories = ["multimedia::video", "encoding"]
# Integration tests and the SIMD oracle depend on sibling workspace crates
# and fixtures. Cargo strips their path-only dev-dependencies from registry
# packages, so these targets belong to the source workspace.
exclude = ["tests/**", "examples/sad_simd_oracle.rs"]

[lints]
workspace = true

[features]
highbitdepth = ["rvp9-core/highbitdepth"]
# Keeps timer-heavy internal profiling available without carrying its branches
# through the production encoder's prediction and transform loops.
runtime-profiling = []

[dependencies]
rvp9-core = { version = "0.2.0-beta.1", path = "../rvp9-core" }

[dev-dependencies]
# Used by unit and integration tests that round-trip encoder output through
# the real decoder (no production-time dependency). The version survives
# Cargo's registry-package normalization; the path selects the workspace crate.
rvp9-decoder = { version = "=0.2.0-beta.1", path = "../rvp9-decoder" }
# F12.0 — BD-rate computation pulled in by the `bdrate_gate`
# integration test (gated `#[ignore]` so it doesn't run on every
# `cargo test`).
rvp9-harness = { path = "../rvp9-harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
