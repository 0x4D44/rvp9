[package]
name = "rvp9-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "VP9 real-time video encoder. Mirrors libvpx tile-threaded architecture; targets WebRTC and livestream use cases."

[lints]
workspace = true

[features]
highbitdepth = ["rvp9-core/highbitdepth"]

[dependencies]
rvp9-core = { path = "../rvp9-core" }

[dev-dependencies]
# Used in integration tests that round-trip encoder output through the
# real decoder (no production-time dependency).
rvp9-decoder = { path = "../rvp9-decoder" }
# F12.0 — BD-rate computation pulled in by the `bdrate_gate`
# integration test (gated `#[ignore]` so it doesn't run on every
# `cargo test`).
rvp9-harness = { path = "../rvp9-harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
