[package]
name = "rvp9-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Test harnesses: VP9 conformance runner and bitstream differential diff tool."

# Intentionally NOT inheriting `[lints.workspace]` per HLD §G11
# deliverable 1: integration-test harnesses print pass/fail tallies
# and per-vector diagnostics to stderr/stdout — that IS the output
# mechanism, so denying `clippy::print_stderr` + `print_stdout` here
# would be the wrong rule.
#
# Re-enables only the unsafe-related lints from the workspace table;
# `print_stderr` / `print_stdout` are deliberately omitted because
# this test-harness crate uses stderr/stdout for legitimate
# pass/fail diagnostics.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bin]]
name = "diff-bitstream"
path = "src/bin/diff_bitstream.rs"

[[bin]]
name = "check-lld-format"
path = "src/bin/check_lld_format.rs"

[[bin]]
name = "extract-divergences"
path = "src/bin/extract_divergences.rs"

[[bin]]
name = "decode-coefs-oracle-diff"
path = "src/bin/decode_coefs_oracle_diff.rs"

[[bin]]
name = "f02-block-oracle"
path = "src/bin/f02_block_oracle.rs"

[dependencies]
rvp9-core = { path = "../rvp9-core" }
rvp9-io = { path = "../rvp9-io" }
rvp9-decoder = { path = "../rvp9-decoder" }
rvp9-encoder = { path = "../rvp9-encoder" }
