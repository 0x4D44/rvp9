[package]
name = "rvp9-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Performance benchmarks: real-time latency (ms/frame) and BD-rate measurement against libvpx."

# Intentionally NOT inheriting `[lints.workspace]` per HLD §G11
# deliverable 1: benchmarks legitimately print results to stdout /
# diagnostics to stderr, so `clippy::print_stderr` + `print_stdout`
# would be the wrong rule here.
#
# Re-enables only the unsafe-related lints from the workspace table;
# `print_stderr` / `print_stdout` are deliberately omitted because
# this benchmark crate uses stderr/stdout for legitimate user-facing
# output.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "realtime"
path = "src/bin/realtime.rs"

[[bin]]
name = "bdrate"
path = "src/bin/bdrate.rs"

[[bin]]
name = "decode-throughput"
path = "src/bin/decode-throughput.rs"

[[bin]]
name = "decode-headtohead"
path = "src/bin/decode-headtohead.rs"

[[bin]]
name = "bench-compare"
path = "src/bin/bench-compare.rs"

[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[[bin]]
name = "dsp-microbench"
path = "src/bin/dsp-microbench.rs"

# T-5: per-tile dispatch profiling driver. Requires the `profile-tiles`
# cargo feature on `rvp9-decoder`. Build via
# `cargo run --release --features rvp9-decoder/profile-tiles \
#   --bin decode-profile-tiles`.
[[bin]]
name = "decode-profile-tiles"
path = "src/bin/decode-profile-tiles.rs"

[features]
# Mirror feature on rvp9-decoder; lets CI build the bench crate with
# the profile instrumentation in one step:
#   cargo build --release --features rvp9-bench/profile-tiles
# is equivalent to passing `--features rvp9-decoder/profile-tiles`.
profile-tiles = ["rvp9-decoder/profile-tiles"]

[dependencies]
rvp9-core = { path = "../rvp9-core" }
rvp9-decoder = { path = "../rvp9-decoder" }
rvp9-encoder = { path = "../rvp9-encoder" }
rvp9-harness = { path = "../rvp9-harness" }
