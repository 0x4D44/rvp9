[package]
name = "rvp9-decoder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"
description = "VP9 video decoder. Spec-conformant; validated against the official VP9 test vectors."

[lints]
workspace = true

[features]
# T-5 per-tile-dispatch profiling. OFF by default — when off, the
# `profile` module and every use site in `lib.rs` vanishes at parse
# time, leaving conformance and bench numbers unperturbed. ON in CI
# job `decoder-profile-tiles` and in the `decode-profile-tiles` bench
# binary, which writes per-frame rdtsc-delta phase timings to the CSV
# at `RVP9_PROFILE_TILES_OUT`. See `wrk_docs/Track_T/T5_*` for design.
profile-tiles = []

[dependencies]
rvp9-core = { version = "0.2.0-alpha.2", path = "../rvp9-core" }
# Drift-catch for `Decoder: Send + Sync` — see lib.rs near the
# `assert_impl_all!` invocation. `static_assertions` is a zero-cost
# compile-time-only crate (all macros expand to unused fns).
static_assertions = "1.1"

[dev-dependencies]
# Wave A G12 — used by `tests/panic_safety.rs` to build the inter-
# frame fixture for the mid-tile-failure test (otherwise the test
# would re-derive ~300 lines of synthetic-packet plumbing already
# present in the encoder). Circular dev-dep is fine: cargo only
# rejects regular-dep cycles, and the encoder's own dev-dep on the
# decoder is the symmetric case (round-trip integration tests).
rvp9-encoder = { path = "../rvp9-encoder" }
# Stage 11 coverage boost — used by `tests/conformance_coverage.rs`
# to read IVF/WebM containers and compute the libvpx-style visible
# MD5 digest. Avoids the dev-dep cycle through `rvp9-harness` which
# depends on `rvp9-decoder` regularly.
rvp9-io = { path = "../rvp9-io" }
