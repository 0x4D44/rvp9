[package]
name = "rvp9-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared VP9 codec primitives: bitstream, entropy, transforms, intra prediction, loop filter, frame buffers, and per-arch SIMD kernels."

[lints]
workspace = true

[features]
# W6.1 — High Bit Depth scaffold. Default OFF; ON flips
# `Pixel = u8` to `Pixel = u16` and exposes the `BitDepth::Bd10/Bd12`
# variants alongside `Bd8`. The kernel pairs themselves (HBD SAD,
# variance, FDCT, IDCT, predictors, loop filter, quantize) are NOT
# implemented under this feature — see `dsp/highbd.rs` for the stub
# surface. libvpx parity: `CONFIG_VP9_HIGHBITDEPTH` configure switch
# plus `YV12_FLAG_HIGHBITDEPTH = 8` in `vpx_scale/yv12config.h:67`.
highbitdepth = []

[dependencies]
# G5 — tile-threaded decode. MPMC `Receiver` is required because the
# worker pool has one job queue feeding many worker threads (each
# competing to receive). `std::sync::mpsc` is SPSC on the receive side
# (`Receiver: !Sync`), so it cannot back a `recv()` loop on multiple
# worker threads from the same channel. See
# `crates/rvp9-core/src/tile_threading/SAFETY.md` §3 for the full
# justification.
crossbeam-channel = "0.5"

[dev-dependencies]
# G4.1 — scalar-vs-SIMD differential proptests for the AVX2 idct8x8
# pilot. Property-based generation lets us cover the EOB-bucket /
# misalignment / saturation strata without hand-curating every
# corner case. See `dsp/x86_64/idct8x8_avx2.rs`'s test module.
proptest = "1"
