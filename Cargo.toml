# rvp9-2 workspace
#
# Virtual workspace — no root package. See PLAN.md, §5 for layout rationale.
#
# Crate split:
#   rvp9-core    Shared primitives used by both decoder and encoder.
#   rvp9-decoder Spec-conformant VP9 decoder (Stage 3).
#   rvp9-encoder Real-time VP9 encoder, libvpx-mirrored (Stage 4).
#   rvp9-cli     `rvp9enc` / `rvp9dec` binaries.
#   rvp9-bench   Real-time latency + BD-rate benchmarks (Stage 0+).
#   rvp9-harness Conformance + differential test runners (Stage 0+).

[workspace]
resolver = "2"
members = [
    "crates/rvp9-core",
    "crates/rvp9-decoder",
    "crates/rvp9-encoder",
    "crates/rvp9-cli",
    "crates/rvp9-bench",
    "crates/rvp9-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Arthur <martin@tollens.ai>"]
rust-version = "1.95"

# Lints applied to every workspace member via `[lints] workspace = true` in
# the per-crate manifests. Start conservative; tighten as the codebase matures.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release: maximum optimization. We will be CPU-bound at 1080p60.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Bench inherits release so benchmarks reflect production performance.
[profile.bench]
inherits = "release"

# Dev: enough optimization to make tests run in reasonable time on a video pipeline.
[profile.dev]
opt-level = 1
