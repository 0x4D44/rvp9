# rvp9-2 workspace
#
# Virtual workspace — no root package. See PLAN.md, §5 for layout rationale.
#
# Crate split:
#   rvp9-core    Shared primitives used by both decoder and encoder.
#   rvp9-io      Shared container (IVF/WebM) + Y4M I/O and MD5 helpers.
#   rvp9-decoder Spec-conformant VP9 decoder (Stage 3).
#   rvp9-encoder Real-time VP9 encoder, libvpx-mirrored (Stage 4).
#   rvp9-cli     `rvp9enc` / `rvp9dec` binaries.
#   rvp9-bench   Real-time latency + BD-rate benchmarks (Stage 0+).
#   rvp9-harness Conformance + differential test runners (Stage 0+).

[workspace]
resolver = "2"
members = [
    "crates/rvp9-core",
    "crates/rvp9-io",
    "crates/rvp9-decoder",
    "crates/rvp9-encoder",
    "crates/rvp9-cli",
    "crates/rvp9-bench",
    "crates/rvp9-harness",
    "crates/rvp9",
]
# Note: `crates/rvp9-fuzz` is NOT a workspace member. cargo-fuzz uses
# `#![no_main]` (libFuzzer convention); building it via plain
# `cargo build --workspace` triggers LNK1561 on Windows. The fuzz
# crate is excluded by omission — invoke via `cargo fuzz run` (or
# `cd crates/rvp9-fuzz && cargo +nightly fuzz run`).

[workspace.package]
version = "0.1.62"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Arthur <martin@tollens.ai>"]
rust-version = "1.95"

# Library-crate lints (Wave A G11 — see HLD §G11 deliverable 1).
#
# Applied via `[lints] workspace = true` in EACH LIBRARY crate's manifest
# (`rvp9-core`, `rvp9-decoder`, `rvp9-encoder`). The CLI / bench /
# harness crates intentionally do NOT inherit — for those, eprintln /
# println is the correct output mechanism, so denying them would be
# wrong. See per-crate `Cargo.toml` for the explicit non-inheritance
# comment.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every `unsafe { ... }` in a library crate must carry a `// SAFETY:`
# comment explaining why the soundness contract is met. Mechanically
# enforces the unsafe-review process documented in
# `notes/decoder-hardening/unsafe-review-checklist.md`. No live unsafe
# blocks exist today; Wave C G4 (target_feature intrinsics) and G5
# (shared plane writes) land the first ones — the lint catches missing
# comments at PR time.
undocumented_unsafe_blocks = "deny"
# Library code should not write to stderr/stdout directly. Diagnostics
# belong in `DecodeError` variants or the `log`/`tracing` facade.
# Per HLD V6 §G11 deliverable 3 the existing trace-debug `eprintln!`s are
# triaged in a follow-up sweep (~80% delete-or-cfg!(rvp9_trace),
# ~10% promote to `DecodeError`, ~10% convert to log::info!); until
# that sweep lands the offending modules carry a local
# `#[allow(clippy::print_stderr)]` with a pointer back to this lint.
print_stderr = "deny"
print_stdout = "deny"

# Release: maximum optimization. We will be CPU-bound at 1080p60.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"

# Bench inherits release so benchmarks reflect production performance.
[profile.bench]
inherits = "release"

# Dev: enough optimization to make tests run in reasonable time on a video pipeline.
[profile.dev]
opt-level = 1
